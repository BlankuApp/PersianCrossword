<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crossword Grid Importer</title>
  <style>
    /* ----- Reset ----- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ----- Base ----- */
    body {
      font-family: system-ui, Tahoma, Arial, sans-serif;
      background: #f3f4f6;
      color: #111;
      padding: 1.75rem 2rem;
      min-height: 100vh;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; }

    /* ----- Form controls ----- */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-end;
      margin-bottom: 1.25rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.35rem; }
    label  { font-size: 0.82rem; font-weight: 600; color: #333; }
    .hint  { font-size: 0.78rem; color: #888; }

    input[type="file"],
    input[type="number"] {
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.88rem;
      background: #fff;
    }
    input[type="file"]   { padding: 0.35rem 0.6rem; cursor: pointer; }
    input[type="number"] { padding: 0.4rem 0.6rem; width: 7rem; }

    button {
      padding: 0.48rem 1.1rem;
      border: 1px solid #b0b0b0;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
      font-size: 0.88rem;
      transition: background 0.12s;
      white-space: nowrap;
    }
    button:hover:not(:disabled) { background: #e8e8e8; }
    button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    button.primary:hover:not(:disabled) { background: #1558b0; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    /* ----- Status banner ----- */
    .status {
      padding: 0.55rem 0.85rem;
      border-radius: 5px;
      font-size: 0.875rem;
      margin-bottom: 1.1rem;
      display: none;
    }
    .status.info  { display: block; background: #e8f0fe; border: 1px solid #aac4f5; color: #174ea6; }
    .status.error { display: block; background: #fdecea; border: 1px solid #f5a5a0; color: #900; }

    /* ----- Preview area ----- */
    #preview-area { display: none; margin-top: 1.5rem; }

    .previews {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(320px, 1fr);
      gap: 1.5rem;
      align-items: flex-start;
    }
    .preview-col {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-width: 0;
    }
    .preview-label { font-size: 0.78rem; font-weight: 600; color: #555; text-align: center; }
    .warped-panel {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      width: fit-content;
      max-width: 100%;
      align-self: center;
    }
    .preview-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
    }
    .zoom-badge {
      min-width: 4.5rem;
      text-align: center;
      padding: 0.42rem 0.7rem;
      background: #fff;
      border: 1px solid #d1d5db;
      border-radius: 999px;
      color: #374151;
      font-size: 0.82rem;
      font-variant-numeric: tabular-nums;
    }
    .raw-stage {
      width: min(100%, 1200px);
      max-height: 78vh;
      overflow: auto;
      padding: 0.65rem;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      background:
        linear-gradient(45deg, #eef2f7 25%, transparent 25%),
        linear-gradient(-45deg, #eef2f7 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #eef2f7 75%),
        linear-gradient(-45deg, transparent 75%, #eef2f7 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    }

    /* Image containers */
    .img-box {
      position: relative;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
    }
    .img-box img {
      display: block;
      height: auto;
    }
    #raw-col .img-box {
      display: block;
      width: max-content;
      max-width: none;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.16);
    }
    #raw-img {
      width: auto;
      max-width: none;
    }
    #warped-img {
      max-width: min(560px, calc(100vw - 4rem));
      max-height: 72vh;
    }
    #warped-col .img-box {
      align-self: center;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.12);
    }
    .img-box canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    #raw-overlay { pointer-events: none; }
    #raw-overlay.manual { pointer-events: auto; cursor: crosshair; touch-action: none; }

    /* Grid overlay — must be LTR so column indices match image pixels */
    #grid-overlay {
      position: absolute;
      inset: 0;
      display: grid;
      direction: ltr;
    }

    /* Individual cell buttons */
    .cell {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      outline: none;
      position: relative;
      transition: background 0.08s;
    }
    .cell:hover          { background: rgba(26, 115, 232, 0.12); }
    .cell:focus-visible  { box-shadow: inset 0 0 0 2px #1a73e8; }

    /* Red circle for detected black squares */
    .cell.black::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 60%; height: 60%;
      border-radius: 50%;
      background: rgba(220, 38, 38, 0.80);
      border: 2px solid rgba(255, 255, 255, 0.70);
      pointer-events: none;
      transition: background 0.10s;
    }
    .cell.black:hover::after { background: rgba(185, 20, 20, 0.90); }

    /* ----- Toolbar & output ----- */
    .toolbar {
      margin-top: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    #output {
      margin-top: 0.9rem;
      padding: 0.75rem 0.9rem;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 0.78rem;
      max-height: 18rem;
      overflow: auto;
      white-space: pre;
      direction: ltr;
      text-align: left;
    }

    @media (max-width: 1100px) {
      .previews { grid-template-columns: 1fr; }
      .raw-stage { max-height: 68vh; }
      #warped-img { max-width: min(700px, calc(100vw - 4rem)); }
    }

    @media (max-width: 640px) {
      body { padding: 1rem; }
      .controls { gap: 0.75rem; }
      .raw-stage { padding: 0.4rem; max-height: 60vh; }
      #warped-img { max-width: calc(100vw - 2rem); }
    }
  </style>
</head>
<body>

  <h1>Crossword Grid Importer</h1>

  <div class="controls">
    <div class="field">
      <label for="file-input">تصویر جدول</label>
      <input type="file" id="file-input" accept="image/*">
      <span class="hint">یا Ctrl+V برای paste از کلیپ‌بورد</span>
    </div>
    <div class="field">
      <label for="n-input">اندازه جدول</label>
      <input type="number" id="n-input" placeholder="خودکار" min="3" max="50" value="15">
      <span class="hint">خالی = تشخیص خودکار</span>
    </div>
    <button class="primary" id="detect-btn">تشخیص جدول</button>
    <button id="manual-btn" type="button" style="display:none">تنظیم گوشه‌ها</button>
    <button id="confirm-corners-btn" type="button" style="display:none">تایید گوشه‌ها</button>
    <button id="cancel-corners-btn" type="button" style="display:none">لغو</button>
  </div>

  <div class="status" id="status"></div>

  <div id="preview-area">
    <div class="previews">
      <div class="preview-col" id="raw-col" style="display:none">
        <div class="preview-label">تصویر ورودی</div>
        <div class="preview-tools">
          <button id="zoom-out-btn" type="button">-</button>
          <div class="zoom-badge" id="zoom-level">100%</div>
          <button id="zoom-in-btn" type="button">+</button>
          <button id="zoom-reset-btn" type="button">اندازه مناسب</button>
        </div>
        <div class="raw-stage" id="raw-stage">
          <div class="img-box">
            <img id="raw-img" alt="تصویر اصلی">
            <canvas id="raw-overlay" aria-hidden="true"></canvas>
          </div>
        </div>
      </div>
      <div class="preview-col" id="warped-col" style="display:none">
        <div class="warped-panel">
          <div class="preview-label">پس از پردازش — روی خانه‌ها کلیک کنید تا تغییر دهید</div>
          <div class="img-box">
            <img id="warped-img" alt="جدول تصحیح‌شده">
            <div id="grid-overlay" role="grid" aria-label="ویرایش خانه‌های جدول"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="toolbar" id="edit-toolbar" style="display:none">
      <button id="copy-btn">Copy</button>
      <button id="reset-btn">بازنشانی</button>
    </div>

    <pre id="output" dir="ltr" style="display:none"></pre>
  </div>

  <script>
    // ----- Element refs -----
    const fileInput   = document.getElementById('file-input');
    const nInput      = document.getElementById('n-input');
    const detectBtn   = document.getElementById('detect-btn');
    const statusEl    = document.getElementById('status');
    const previewArea = document.getElementById('preview-area');
    const rawCol      = document.getElementById('raw-col');
    const rawStage    = document.getElementById('raw-stage');
    const rawImg      = document.getElementById('raw-img');
    const rawOverlay  = document.getElementById('raw-overlay');
    const zoomOutBtn  = document.getElementById('zoom-out-btn');
    const zoomInBtn   = document.getElementById('zoom-in-btn');
    const zoomResetBtn = document.getElementById('zoom-reset-btn');
    const zoomLevelEl = document.getElementById('zoom-level');
    const manualBtn   = document.getElementById('manual-btn');
    const confirmCornersBtn = document.getElementById('confirm-corners-btn');
    const cancelCornersBtn  = document.getElementById('cancel-corners-btn');
    const warpedCol   = document.getElementById('warped-col');
    const warpedImg   = document.getElementById('warped-img');
    const gridOverlay = document.getElementById('grid-overlay');
    const editToolbar = document.getElementById('edit-toolbar');
    const outputEl    = document.getElementById('output');
    const copyBtn     = document.getElementById('copy-btn');
    const resetBtn    = document.getElementById('reset-btn');

    // ----- State -----
    let detectedMatrix = null;  // pristine server result
    let currentMatrix  = null;  // user-edited copy
    let numRows = 0, numCols = 0;
    let sourceBlob = null;
    let manualMode = false;
    let manualCorners = [];
    let lastDetectedCorners = null;
    let rawZoom = 1;

    // ----- Status -----
    function showStatus(msg, type = 'info') {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + type;
    }
    function clearStatus() { statusEl.className = 'status'; }

    function fitRawScale() {
      if (!rawImg.naturalWidth) return 1;
      const availableWidth = Math.max(rawStage.clientWidth - 20, 280);
      return Math.min(1, availableWidth / rawImg.naturalWidth);
    }

    function updateZoomControls() {
      const disabled = !sourceBlob || detectBtn.disabled;
      zoomOutBtn.disabled = disabled || rawZoom <= 1;
      zoomInBtn.disabled = disabled || rawZoom >= 3;
      zoomResetBtn.disabled = disabled || rawZoom === 1;
      zoomLevelEl.textContent = `${Math.round(rawZoom * 100)}%`;
    }

    function applyRawZoom() {
      if (!rawImg.naturalWidth) {
        updateZoomControls();
        return;
      }

      const displayWidth = Math.max(240, Math.round(rawImg.naturalWidth * fitRawScale() * rawZoom));
      rawImg.style.width = `${displayWidth}px`;

      requestAnimationFrame(() => {
        syncRawOverlaySize();
        updateZoomControls();
      });
    }

    function setRawZoom(nextZoom) {
      const clampedZoom = Math.min(3, Math.max(1, nextZoom));
      if (clampedZoom === rawZoom && rawImg.naturalWidth) {
        updateZoomControls();
        return;
      }
      rawZoom = clampedZoom;
      applyRawZoom();
    }

    function setBusy(isBusy) {
      detectBtn.disabled = isBusy;
      fileInput.disabled = isBusy;
      nInput.disabled = isBusy;
      updateCornerControls();
      updateZoomControls();
    }

    function clearDetectedState() {
      detectedMatrix = null;
      currentMatrix = null;
      numRows = 0;
      numCols = 0;
      gridOverlay.innerHTML = '';
      warpedImg.removeAttribute('src');
      warpedCol.style.display = 'none';
      editToolbar.style.display = 'none';
      outputEl.style.display = 'none';
      outputEl.textContent = '';
    }

    function updateCornerControls() {
      const hasSource = Boolean(sourceBlob);
      manualBtn.style.display = hasSource && !manualMode ? '' : 'none';
      confirmCornersBtn.style.display = manualMode ? '' : 'none';
      cancelCornersBtn.style.display = manualMode ? '' : 'none';
      manualBtn.disabled = !hasSource || detectBtn.disabled;
      confirmCornersBtn.disabled = detectBtn.disabled || manualCorners.length !== 4;
      cancelCornersBtn.disabled = detectBtn.disabled;
      rawOverlay.classList.toggle('manual', manualMode);
    }

    // ----- Raw-image preview -----
    function showRawPreview(blob) {
      sourceBlob = blob;
      rawZoom = 1;
      if (rawImg._objectUrl) URL.revokeObjectURL(rawImg._objectUrl);
      rawImg._objectUrl = URL.createObjectURL(blob);
      rawImg.src = rawImg._objectUrl;
      rawCol.style.display = '';
      previewArea.style.display = 'block';
      updateCornerControls();
      updateZoomControls();
    }

    function syncRawOverlaySize() {
      const width = rawImg.clientWidth;
      const height = rawImg.clientHeight;
      if (!width || !height) return;

      const ratio = window.devicePixelRatio || 1;
      rawOverlay.width = Math.round(width * ratio);
      rawOverlay.height = Math.round(height * ratio);
      rawOverlay.style.width = width + 'px';
      rawOverlay.style.height = height + 'px';

      const ctx = rawOverlay.getContext('2d');
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      renderRawOverlay();
    }

    function imagePointToDisplay(point) {
      return {
        x: (point[0] / rawImg.naturalWidth) * rawImg.clientWidth,
        y: (point[1] / rawImg.naturalHeight) * rawImg.clientHeight,
      };
    }

    function displayPointToImage(clientX, clientY) {
      const rect = rawOverlay.getBoundingClientRect();
      const x = ((clientX - rect.left) / rect.width) * rawImg.naturalWidth;
      const y = ((clientY - rect.top) / rect.height) * rawImg.naturalHeight;
      return [
        Math.min(Math.max(x, 0), rawImg.naturalWidth - 1),
        Math.min(Math.max(y, 0), rawImg.naturalHeight - 1),
      ];
    }

    function drawCorners(ctx, corners, strokeStyle, pointStyle, dashed = false) {
      if (!corners || !corners.length) return;

      const points = corners.map(imagePointToDisplay);
      ctx.save();
      ctx.lineWidth = 2;
      ctx.strokeStyle = strokeStyle;
      ctx.fillStyle = pointStyle;
      if (dashed) ctx.setLineDash([8, 6]);

      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      if (points.length === 4) ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);

      points.forEach((point, index) => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(index + 1), point.x, point.y);
        ctx.fillStyle = pointStyle;
      });
      ctx.restore();
    }

    function renderRawOverlay() {
      const ctx = rawOverlay.getContext('2d');
      if (!ctx) return;

      ctx.clearRect(0, 0, rawOverlay.width, rawOverlay.height);
      if (!sourceBlob || !rawImg.naturalWidth || !rawImg.clientWidth) return;

      if (lastDetectedCorners) {
        drawCorners(ctx, lastDetectedCorners, 'rgba(26, 115, 232, 0.95)', 'rgba(26, 115, 232, 0.95)', true);
      }

      if (manualCorners.length) {
        drawCorners(ctx, manualCorners, 'rgba(220, 38, 38, 0.95)', 'rgba(220, 38, 38, 0.95)');
      }
    }

    function enterManualMode() {
      if (!sourceBlob) return;
      manualMode = true;
      manualCorners = [];
      updateCornerControls();
      renderRawOverlay();
      showStatus('چهار گوشه جدول را روی تصویر اصلی انتخاب کنید. ترتیب کلیک مهم نیست.', 'info');
    }

    function exitManualMode(clearMessage = false) {
      manualMode = false;
      manualCorners = [];
      updateCornerControls();
      renderRawOverlay();
      if (clearMessage) clearStatus();
    }

    function handleRawOverlayPointerDown(event) {
      if (!manualMode || !rawImg.naturalWidth) return;

      if (manualCorners.length === 4) {
        manualCorners = [];
      }

      manualCorners.push(displayPointToImage(event.clientX, event.clientY));
      renderRawOverlay();
      updateCornerControls();

      if (manualCorners.length === 4) {
        showStatus('چهار گوشه انتخاب شد. برای پردازش، روی تایید گوشه‌ها بزنید.', 'info');
      } else {
        showStatus(`گوشه ${manualCorners.length} ثبت شد. ${4 - manualCorners.length} گوشه دیگر باقی مانده است.`, 'info');
      }
    }

    // ----- API call -----
    async function detect(corners = null) {
      if (!sourceBlob) return;

      const fd = new FormData();
      fd.append('image', sourceBlob, 'image.png');
      const nVal = nInput.value.trim();
      if (nVal !== '') fd.append('n', nVal);
      if (corners) fd.append('corners', JSON.stringify(corners));

      setBusy(true);
      showStatus(corners ? 'در حال پردازش تصویر با گوشه‌های دستی…' : 'در حال پردازش تصویر…');

      try {
        const resp = await fetch('/api/detect', { method: 'POST', body: fd });
        const data = await resp.json();

        if (!resp.ok) {
          showStatus('خطا: ' + (data.detail ?? resp.statusText), 'error');
          return;
        }

        clearStatus();
        numRows = data.rows;
        numCols = data.cols;
        detectedMatrix = data.matrix.map(r => [...r]);
        currentMatrix  = data.matrix.map(r => [...r]);
        lastDetectedCorners = Array.isArray(data.corners) ? data.corners : null;

        warpedImg.src = 'data:image/png;base64,' + data.warped_png_b64;
        previewArea.style.display = 'block';
        warpedCol.style.display = '';
        editToolbar.style.display = '';
        outputEl.style.display = 'block';
        buildOverlay();
        updateOutput();
        exitManualMode(true);
        applyRawZoom();
      } catch (err) {
        showStatus('خطای شبکه: ' + err.message, 'error');
      } finally {
        setBusy(false);
      }
    }

    function loadSource(blob) {
      clearStatus();
      clearDetectedState();
      lastDetectedCorners = null;
      showRawPreview(blob);
      exitManualMode();
      renderRawOverlay();
    }

    // ----- Input sources -----
    detectBtn.addEventListener('click', () => {
      if (!fileInput.files.length) {
        showStatus('لطفاً ابتدا یک تصویر انتخاب کنید.', 'error');
        return;
      }
      loadSource(fileInput.files[0]);
      detect();
    });

    document.addEventListener('paste', (e) => {
      const item = [...(e.clipboardData?.items ?? [])].find(i => i.kind === 'file');
      if (!item) {
        showStatus('هیچ تصویری در کلیپ‌بورد یافت نشد. ابتدا یک تصویر کپی کنید.', 'error');
        return;
      }
      e.preventDefault();
      loadSource(item.getAsFile());
      detect();
    });

    rawImg.addEventListener('load', applyRawZoom);
    rawOverlay.addEventListener('pointerdown', handleRawOverlayPointerDown);
    window.addEventListener('resize', applyRawZoom);
    manualBtn.addEventListener('click', enterManualMode);
    confirmCornersBtn.addEventListener('click', () => {
      if (manualCorners.length !== 4) return;
      detect(manualCorners);
    });
    cancelCornersBtn.addEventListener('click', () => exitManualMode(true));
    zoomOutBtn.addEventListener('click', () => setRawZoom(rawZoom - 0.25));
    zoomInBtn.addEventListener('click', () => setRawZoom(rawZoom + 0.25));
    zoomResetBtn.addEventListener('click', () => setRawZoom(1));

    // ----- Grid overlay -----
    function buildOverlay() {
      gridOverlay.style.gridTemplateColumns = `repeat(${numCols}, 1fr)`;
      gridOverlay.style.gridTemplateRows    = `repeat(${numRows}, 1fr)`;
      gridOverlay.innerHTML = '';

      for (let r = 0; r < numRows; r++) {
        for (let c = 0; c < numCols; c++) {
          const btn = document.createElement('button');
          btn.className = 'cell' + (currentMatrix[r][c] ? ' black' : '');
          btn.dataset.r = r;
          btn.dataset.c = c;
          btn.setAttribute('role', 'gridcell');
          btn.setAttribute('aria-label', `ردیف ${r + 1} ستون ${c + 1}`);
          btn.setAttribute('tabindex', r === 0 && c === 0 ? '0' : '-1');
          btn.addEventListener('click', onCellClick);
          btn.addEventListener('keydown', onCellKeydown);
          gridOverlay.appendChild(btn);
        }
      }
    }

    function cellAt(r, c) { return gridOverlay.children[r * numCols + c]; }

    function toggleCell(r, c) {
      currentMatrix[r][c] ^= 1;
      cellAt(r, c).className = 'cell' + (currentMatrix[r][c] ? ' black' : '');
      updateOutput();
    }

    function onCellClick(e) {
      toggleCell(+e.currentTarget.dataset.r, +e.currentTarget.dataset.c);
    }

    function onCellKeydown(e) {
      const r = +e.currentTarget.dataset.r;
      const c = +e.currentTarget.dataset.c;
      let nr = r, nc = c;

      switch (e.key) {
        case 'ArrowRight': nc = (c - 1 + numCols) % numCols; break;
        case 'ArrowLeft':  nc = (c + 1) % numCols;           break;
        case 'ArrowDown':  nr = (r + 1) % numRows;           break;
        case 'ArrowUp':    nr = (r - 1 + numRows) % numRows; break;
        case ' ':
        case 'Enter': e.preventDefault(); toggleCell(r, c); return;
        default: return;
      }

      e.preventDefault();
      e.currentTarget.setAttribute('tabindex', '-1');
      const next = cellAt(nr, nc);
      next.setAttribute('tabindex', '0');
      next.focus();
    }

    // ----- Output -----
    function formatMatrix() {
      if (!currentMatrix) return '';
      return '[\n' + currentMatrix.map(row => '    [' + row.join(', ') + ']').join(',\n') + '\n  ]';
    }

    function updateOutput() { outputEl.textContent = formatMatrix(); }

    copyBtn.addEventListener('click', () =>
      navigator.clipboard.writeText(formatMatrix())
        .then(() => showStatus('جدول در کلیپ‌بورد کپی شد.'))
    );

    resetBtn.addEventListener('click', () => {
      if (!detectedMatrix) return;
      currentMatrix = detectedMatrix.map(r => [...r]);
      buildOverlay();
      updateOutput();
    });

    updateCornerControls();
    updateZoomControls();
  </script>

</body>
</html>
